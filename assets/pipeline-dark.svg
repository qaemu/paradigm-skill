<rect x="26" y="26" width="248" height="118" fill="#0F2236" stroke="#E4ECF3" stroke-width="1.2"/>
<text x="42" y="66" font-size="30" font-weight="700" fill="#F0B23E">1</text>
<text x="74" y="64" font-size="21" font-weight="700" fill="#E4ECF3">Map the field</text>
<line x1="42" y1="80" x2="258" y2="80" stroke="#284767" stroke-width="1"/>
<text x="42" y="106" font-size="15.5" fill="#9FB4C7">Break it into constraints:</text>
<text x="42" y="127" font-size="15.5" fill="#9FB4C7">parts, labor, law, norms</text>
<rect x="322" y="26" width="248" height="118" fill="#0F2236" stroke="#E4ECF3" stroke-width="1.2"/>
<text x="338" y="66" font-size="30" font-weight="700" fill="#F0B23E">2</text>
<text x="370" y="64" font-size="21" font-weight="700" fill="#E4ECF3">Price curves</text>
<line x1="338" y1="80" x2="554" y2="80" stroke="#284767" stroke-width="1"/>
<text x="338" y="106" font-size="15.5" fill="#9FB4C7">Yearly medians, robust trend,</text>
<text x="338" y="127" font-size="15.5" fill="#9FB4C7">inflation removed</text>
<rect x="618" y="26" width="248" height="118" fill="#0F2236" stroke="#E4ECF3" stroke-width="1.2"/>
<text x="634" y="66" font-size="30" font-weight="700" fill="#F0B23E">3</text>
<text x="666" y="64" font-size="21" font-weight="700" fill="#E4ECF3">Non-cost sweep</text>
<line x1="634" y1="80" x2="850" y2="80" stroke="#284767" stroke-width="1"/>
<text x="634" y="106" font-size="15.5" fill="#9FB4C7">Laws, expiring patents,</text>
<text x="634" y="127" font-size="15.5" fill="#9FB4C7">skills, norms, supply</text>
<rect x="914" y="26" width="248" height="118" fill="#0F2236" stroke="#E4ECF3" stroke-width="1.2"/>
<text x="930" y="66" font-size="30" font-weight="700" fill="#F0B23E">4</text>
<text x="962" y="64" font-size="21" font-weight="700" fill="#E4ECF3">Activity scan</text>
<line x1="930" y1="80" x2="1146" y2="80" stroke="#284767" stroke-width="1"/>
<text x="930" y="106" font-size="15.5" fill="#9FB4C7">Who builds on each one:</text>
<text x="930" y="127" font-size="15.5" fill="#9FB4C7">announced, deployed, paying</text>
<rect x="914" y="228" width="248" height="118" fill="#0F2236" stroke="#3CC9B0" stroke-width="2"/>
<text x="930" y="268" font-size="30" font-weight="700" fill="#F0B23E">5</text>
<text x="962" y="266" font-size="21" font-weight="700" fill="#E4ECF3">Gap matrix</text>
<line x1="930" y1="282" x2="1146" y2="282" stroke="#284767" stroke-width="1"/>
<text x="930" y="308" font-size="15.5" fill="#9FB4C7">How far it fell versus</text>
<text x="930" y="329" font-size="15.5" fill="#9FB4C7">how many are building</text>
<rect x="618" y="228" width="248" height="118" fill="#0F2236" stroke="#3CC9B0" stroke-width="2"/>
<text x="634" y="268" font-size="30" font-weight="700" fill="#F0B23E">6</text>
<text x="666" y="266" font-size="21" font-weight="700" fill="#E4ECF3">Why-not check</text>
<line x1="634" y1="282" x2="850" y2="282" stroke="#284767" stroke-width="1"/>
<text x="634" y="308" font-size="15.5" fill="#9FB4C7">Untried, tried too early,</text>
<text x="634" y="329" font-size="15.5" fill="#9FB4C7">or still blocked</text>
<rect x="322" y="228" width="248" height="118" fill="#0F2236" stroke="#E4ECF3" stroke-width="1.2"/>
<text x="338" y="268" font-size="30" font-weight="700" fill="#F0B23E">7</text>
<text x="370" y="266" font-size="21" font-weight="700" fill="#E4ECF3">Independent check</text>
<line x1="338" y1="282" x2="554" y2="282" stroke="#284767" stroke-width="1"/>
<text x="338" y="308" font-size="15.5" fill="#9FB4C7">A fresh agent re-opens</text>
<text x="338" y="329" font-size="15.5" fill="#9FB4C7">every source</text>
<rect x="26" y="228" width="248" height="118" fill="#0F2236" stroke="#E4ECF3" stroke-width="1.2"/>
<text x="42" y="268" font-size="30" font-weight="700" fill="#F0B23E">8</text>
<text x="74" y="266" font-size="21" font-weight="700" fill="#E4ECF3">Report</text>
<line x1="42" y1="282" x2="258" y2="282" stroke="#284767" stroke-width="1"/>
<text x="42" y="308" font-size="15.5" fill="#9FB4C7">Panorama, charts, and a</text>
<text x="42" y="329" font-size="15.5" fill="#9FB4C7">workbook with every link</text>
</svg>
