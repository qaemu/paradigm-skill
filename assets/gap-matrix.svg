<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Gap matrix: how far each constraint fell against how many companies build on it" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Gap matrix: how far each constraint fell against how many companies build on it</title>
<rect width="900" height="600" rx="20" fill="#FFF6F8"/>
<rect x="96" y="40" width="382" height="232" rx="14" fill="#FDE8EE" stroke="#F7CFDB"/>
<text x="120" y="82" font-size="22" font-weight="600" fill="#C9406B" text-anchor="start" >Open gap</text>
<text x="120" y="106" font-size="14" font-weight="400" fill="#7A7A85" text-anchor="start" >Dropped a lot · few use it yet</text>
<rect x="492" y="40" width="382" height="232" rx="14" fill="#FFFFFF" stroke="#F7CFDB"/>
<text x="516" y="82" font-size="22" font-weight="600" fill="#111111" text-anchor="start" >Crowded</text>
<text x="516" y="106" font-size="14" font-weight="400" fill="#7A7A85" text-anchor="start" >Dropped a lot · many already use it</text>
<rect x="96" y="286" width="382" height="232" rx="14" fill="#FFFFFF" stroke="#F7CFDB"/>
<text x="120" y="328" font-size="22" font-weight="600" fill="#7A7A85" text-anchor="start" >Dormant</text>
<text x="120" y="352" font-size="14" font-weight="400" fill="#7A7A85" text-anchor="start" >Barely moved · little activity</text>
<rect x="492" y="286" width="382" height="232" rx="14" fill="#FFFFFF" stroke="#F7CFDB"/>
<text x="516" y="328" font-size="22" font-weight="600" fill="#111111" text-anchor="start" >Hype risk</text>
<text x="516" y="352" font-size="14" font-weight="400" fill="#7A7A85" text-anchor="start" >Barely moved · many building anyway</text>
<circle cx="150" cy="150" r="7" fill="#C9406B"/>
<text x="166" y="155" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >untried</text>
<circle cx="150" cy="186" r="6" fill="#FFFFFF" stroke="#C9406B" stroke-width="2.5"/>
<text x="166" y="191" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >tried too early</text>
<circle cx="150" cy="222" r="6" fill="#FFFFFF" stroke="#EE9AB3" stroke-width="2.5" stroke-dasharray="3 2.5"/>
<text x="166" y="227" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >blocked: watch list</text>
<text x="516" y="152" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >What most of the field already knows.</text>
<text x="516" y="176" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >The report lists who is there</text>
<text x="516" y="200" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >and how far each one got.</text>
<text x="516" y="398" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >A warning sign: lots of activity</text>
<text x="516" y="422" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >with no real change underneath.</text>
<text x="516" y="446" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >Treat growth claims with caution.</text>
<text x="120" y="398" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >Nothing moved and nobody is</text>
<text x="120" y="422" font-size="15" font-weight="400" fill="#3D3D44" text-anchor="start" >building. Kept for reference.</text>
<text x="485.0" y="554" font-size="15" font-weight="500" fill="#3D3D44" text-anchor="middle" >How many are building on it  →</text>
<text x="56" y="279.0" font-size="15" font-weight="500" fill="#3D3D44" text-anchor="middle" transform="rotate(-90 56 279.0)">How far the constraint dropped  →</text>
</svg>
